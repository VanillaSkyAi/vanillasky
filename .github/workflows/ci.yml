name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Documentation-only changes skip the expensive fan-out gates below. Every job
  # named in branch protection still runs, so a docs pull request can still land.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail closed. Every path that cannot positively prove the change is
          # documentation-only must run the gates, so `code` starts true and is
          # lowered only after a diff that actually succeeded. A silent failure
          # here would skip the gates on real code.
          code=true
          require_gates() {
            echo "Code gates required: true ($1)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] && require_gates "no base commit"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || require_gates "base commit $BASE is unreachable"

          changed=$(git diff --name-only "$BASE" HEAD) || require_gates "git diff against $BASE failed"
          [[ -z "$changed" ]] && require_gates "empty diff against $BASE"

          code=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              *.md | docs/* | LICENSE) ;;
              *) code=true ;;
            esac
          done <<< "$changed"

          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          echo "Code gates required: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - id: pack
        run: node scripts/chat-candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-candidate
          path: |
            artifacts/chat-candidate/package.tgz
            artifacts/chat-candidate/candidate.json
          retention-days: 3

  verify:
    needs: candidate
    env:
      VANILLASKY_PACKED_TARBALL: ${{ github.workspace }}/artifacts/chat-candidate/package.tgz
      VANILLASKY_EXPECTED_INTEGRITY: ${{ needs.candidate.outputs.integrity }}
      VANILLASKY_EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-candidate
          path: artifacts/chat-candidate
      - run: npm run registry:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsc --noEmit --project dev/chat/tsconfig.json
      - run: npm test
      - run: npm run acceptance:chat
      - run: npm run verify:package-size
      - run: npm audit --audit-level=low --omit=dev

  consumer-gate:
    needs: [candidate, changes]
    env:
      VANILLASKY_PACKED_TARBALL: ${{ github.workspace }}/artifacts/chat-candidate/package.tgz
      VANILLASKY_EXPECTED_INTEGRITY: ${{ needs.candidate.outputs.integrity }}
      VANILLASKY_EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        gate: [public-api, packed-package, onboarding]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-candidate
          path: artifacts/chat-candidate
      # The API surface check is React-free; the other clean-room gates exercise a browser.
      - run: npx playwright install chromium
        if: matrix.gate != 'public-api'
      - run: node scripts/verify-public-api-surface.mjs
        if: matrix.gate == 'public-api'
      - run: node scripts/verify-packed-package.mjs
        if: matrix.gate == 'packed-package'
      - run: npm run verify:onboarding
        if: matrix.gate == 'onboarding'

  # Preserve the stable required-check name while the expensive gates fan out.
  consumer-compatibility:
    if: always() && github.event_name == 'pull_request'
    needs: [consumer-gate, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every consumer gate
        env:
          RESULT: ${{ needs.consumer-gate.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [[ "$RESULT" == "skipped" && "$CODE" != "false" ]]; then
            echo "Consumer gate was skipped without a documentation-only verdict." >&2
            exit 1
          fi
          if [[ "$RESULT" == "skipped" ]]; then
            echo "Consumer compatibility skipped: documentation-only change."
            exit 0
          fi
          if [[ "$RESULT" != "success" ]]; then
            echo "Consumer compatibility failed: $RESULT" >&2
            exit 1
          fi

  provider-gate:
    needs: [candidate, changes]
    env:
      VANILLASKY_PACKED_TARBALL: ${{ github.workspace }}/artifacts/chat-candidate/package.tgz
      VANILLASKY_EXPECTED_INTEGRITY: ${{ needs.candidate.outputs.integrity }}
      VANILLASKY_EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, google, openrouter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-candidate
          path: artifacts/chat-candidate
      - run: npx playwright install chromium
      - run: npm run verify:nextjs
        env:
          VANILLASKY_PROVIDER: ${{ matrix.provider }}

  # Preserve the stable required-check name while provider fixtures run independently.
  provider-compatibility:
    if: always() && github.event_name == 'pull_request'
    needs: [provider-gate, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every provider gate
        env:
          RESULT: ${{ needs.provider-gate.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [[ "$RESULT" == "skipped" && "$CODE" != "false" ]]; then
            echo "Provider gate was skipped without a documentation-only verdict." >&2
            exit 1
          fi
          if [[ "$RESULT" == "skipped" ]]; then
            echo "Provider compatibility skipped: documentation-only change."
            exit 0
          fi
          if [[ "$RESULT" != "success" ]]; then
            echo "Provider compatibility failed: $RESULT" >&2
            exit 1
          fi

  node-compatibility:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        # The primary verify job covers Node 22.
        node: [24]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run build

  react-compatibility:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        # The primary verify job uses the locked React 19 dependency.
        react: [18]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm install --no-audit --no-save --package-lock=false react@${{ matrix.react }}.3.1 react-dom@${{ matrix.react }}.3.1 @types/react@18.3.28 @types/react-dom@18.3.7
      - run: npm run typecheck
      - run: npm test -- tests/react.test.tsx tests/use-video-chat.test.tsx tests/video-chat-component.test.tsx tests/video-chat-voice-cancellation.test.tsx tests/player.test.tsx tests/template-kit.test.tsx tests/templates.test.tsx
      - run: npm run build

  browser-gate:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      # Install the virtual audio device as root, then run browsers as pwuser.
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - name: Install a virtual audio output for native narration
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
      - name: Run browsers with a real audio clock
        run: |
          runuser -u pwuser -- bash -eu -c '
            pulseaudio --start --exit-idle-time=-1
            trap "pulseaudio --kill" EXIT
            pactl load-module module-null-sink sink_name=cinematic_test
            pactl set-default-sink cinematic_test
            pactl list short sinks
            npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3 --workers=1
            if [[ "${{ matrix.browser }}" == "chromium" && "${{ matrix.shard }}" == "1" ]]; then
              npx playwright test --config dev/chat/playwright.config.ts
            fi
          '
      - name: Preserve browser playback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-playback-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  # Keep branch protection stable while each browser shard has its own decoder and audio sink.
  browser-compatibility:
    if: always() && github.event_name == 'pull_request'
    needs: [browser-gate, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser gate
        env:
          RESULT: ${{ needs.browser-gate.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [[ "$RESULT" == "skipped" && "$CODE" != "false" ]]; then
            echo "Browser gate was skipped without a documentation-only verdict." >&2
            exit 1
          fi
          if [[ "$RESULT" == "skipped" ]]; then
            echo "Browser compatibility skipped: documentation-only change."
            exit 0
          fi
          if [[ "$RESULT" != "success" ]]; then
            echo "Browser compatibility failed: $RESULT" >&2
            exit 1
          fi

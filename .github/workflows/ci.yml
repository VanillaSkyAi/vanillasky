name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No provider credentials are available to verification, including trusted PRs.
env:
  VIDEO_CHAT_PAID_PROVIDERS: disabled

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
      - run: npm run acceptance:chat
      - run: npm run build
      - run: npm run build:functions
      - run: npm run verify:app-build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-build
          path: |
            dist/
            .generated/functions-build/
            .generated/app-artifact.json
          include-hidden-files: true
          retention-days: 3

  app-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config app.playwright.config.ts --project=${{ matrix.browser }} --fail-on-flaky-tests
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-browser-${{ matrix.browser }}
          path: test-results/
          retention-days: 3

  browser-gate:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      # Install the virtual audio device as root, then run browsers as pwuser.
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - name: Install a virtual audio output for native narration
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
      - name: Run browsers with a real audio clock
        run: |
          runuser -u pwuser -- bash -eu -c '
            pulseaudio --start --exit-idle-time=-1
            trap "pulseaudio --kill" EXIT
            pactl load-module module-null-sink sink_name=cinematic_test
            pactl set-default-sink cinematic_test
            pactl list short sinks
            npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3 --workers=1
          '
      - name: Preserve browser playback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-playback-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 3


  # Fail closed even when an upstream job is cancelled or unexpectedly skipped.
  application-checks:
    if: always()
    needs: [verify, browser-gate, app-browser, node-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require all application checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(jobs)) { if (job.result !== "success") throw new Error(`${name}: ${job.result}`); }'

  # Preserve existing protection while maintainers switch to application-checks.
  browser-compatibility:
    if: always()
    needs: [browser-gate, app-browser]
    runs-on: ubuntu-latest
    steps:
      - run: test "$ENGINE" = success && test "$APP" = success
        env:
          ENGINE: ${{ needs.browser-gate.result }}
          APP: ${{ needs.app-browser.result }}

  node-compatibility:
    strategy:
      matrix:
        node: [24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api

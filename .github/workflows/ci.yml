name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Explicitly build and fully verify main, including after docs-only commits.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VIDEO_CHAT_PAID_PROVIDERS: disabled

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22.23.1
      - run: node scripts/check-docs.mjs
      - id: plan
        run: node scripts/ci-plan.mjs plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan
          path: .generated/ci-plan.json
          include-hidden-files: true
          retention-days: 30

  verify:
    needs: changes
    if: needs.changes.outputs.kind != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run check
      - run: npm run acceptance:chat
      - run: npm run build
      - run: npm run build:functions
      - run: npm run verify:app-build
      - run: npm run verify:preview
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-build
          path: |
            dist/
            .generated/functions-build/
            .generated/app-artifact.json
          include-hidden-files: true
          retention-days: 30

  browser-gate:
    needs: changes
    if: needs.changes.outputs.kind != 'docs'
    name: browser-gate (${{ matrix.browser }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      # Browsers and OS dependencies are already installed; app setup checks
      # share these jobs rather than downloading three more browser installs.
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Prepare workspace ownership
        run: chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
      - name: Check the real application setup
        if: matrix.app
        run: runuser -u pwuser -- npx playwright test --config app.playwright.config.ts --project=${{ matrix.browser }} --fail-on-flaky-tests
      - name: Install a virtual audio output for native narration
        if: needs.changes.outputs.kind == 'full'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
      - name: Run playback with a real audio clock
        if: needs.changes.outputs.kind == 'full'
        run: |
          runuser -u pwuser -- bash -eu -c '
            pulseaudio --start --exit-idle-time=-1
            trap "pulseaudio --kill" EXIT
            pactl load-module module-null-sink sink_name=cinematic_test
            pactl set-default-sink cinematic_test
            pactl list short sinks
            node scripts/browser-shard.mjs ${{ matrix.browser }} ${{ matrix.shard }}/3
          '
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  node-compatibility:
    needs: changes
    if: needs.changes.outputs.kind != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
        with:
          node-version: '24'
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api

  application-checks:
    if: always()
    needs: [changes, verify, browser-gate, node-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require exactly the checks selected by the plan
        env:
          CI_KIND: ${{ needs.changes.outputs.kind }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.mjs gate

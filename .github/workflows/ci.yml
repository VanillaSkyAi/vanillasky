name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm run registry:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run acceptance:chat
      - run: npm run build
      - run: npm run verify:package-size
      - run: npm audit --audit-level=low --omit=dev
      - run: npm pack --dry-run

  consumer-gate:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        gate: [public-api, packed-package, onboarding]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      # The API surface check is React-free; the other clean-room gates exercise a browser.
      - run: npx playwright install chromium
        if: matrix.gate != 'public-api'
      - run: npm run verify:api
        if: matrix.gate == 'public-api'
      - run: npm run verify:package
        if: matrix.gate == 'packed-package'
      - run: npm run verify:onboarding
        if: matrix.gate == 'onboarding'

  # Preserve the stable required-check name while the expensive gates fan out.
  consumer-compatibility:
    if: always() && github.event_name == 'pull_request'
    needs: consumer-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every consumer gate
        env:
          RESULT: ${{ needs.consumer-gate.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "Consumer compatibility failed: $RESULT" >&2
            exit 1
          fi

  provider-gate:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, google, openrouter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npx playwright install chromium
      - run: npm run verify:nextjs
        env:
          VANILLASKY_PROVIDER: ${{ matrix.provider }}

  # Preserve the stable required-check name while provider fixtures run independently.
  provider-compatibility:
    if: always() && github.event_name == 'pull_request'
    needs: provider-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every provider gate
        env:
          RESULT: ${{ needs.provider-gate.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "Provider compatibility failed: $RESULT" >&2
            exit 1
          fi

  node-compatibility:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        # The primary verify job covers Node 22.
        node: [24]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run build

  react-compatibility:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        # The primary verify job uses the locked React 19 dependency.
        react: [18]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - run: npm install --no-audit --no-save --package-lock=false react@${{ matrix.react }}.3.1 react-dom@${{ matrix.react }}.3.1 @types/react@18.3.28 @types/react-dom@18.3.7
      - run: npm run typecheck
      - run: npm test -- tests/react.test.tsx tests/use-video-chat.test.tsx tests/video-chat-component.test.tsx tests/video-chat-voice-cancellation.test.tsx tests/player.test.tsx tests/template-kit.test.tsx tests/templates.test.tsx
      - run: npm run build

  browser-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      # Install the virtual audio device as root, then run browsers as pwuser.
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install the locked npm CLI
        run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - name: Install a virtual audio output for native narration
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
      - name: Run browsers with a real audio clock
        run: |
          runuser -u pwuser -- bash -eu -c '
            pulseaudio --start --exit-idle-time=-1
            trap "pulseaudio --kill" EXIT
            pactl load-module module-null-sink sink_name=cinematic_test
            pactl set-default-sink cinematic_test
            pactl list short sinks
            npx playwright test
          '
      - name: Preserve browser playback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-playback-evidence
          path: test-results/
          retention-days: 3

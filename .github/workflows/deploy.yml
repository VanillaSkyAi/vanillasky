name: Deploy application

# Deploy the exact artifact from successful main CI; never rebuild at release time.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [preview, production]
        default: preview
        required: true
      confirmation:
        description: Type DEPLOY after reviewing the target environment
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: video-chat-deployment-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  release-plan:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
      run_id: ${{ steps.build.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the successful main CI run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --status success --limit 20 --json databaseId,event --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::This main commit has no successful CI run. Wait for CI, then deploy again."
            exit 1
          fi
          gh run download "$run_id" --name ci-plan --dir .generated
          node scripts/ci-plan.mjs deployment
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using verified CI run $run_id" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release-plan
    if: needs.release-plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      DEPLOYMENT_TARGET: ${{ inputs.target }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_QUOTA_DATABASE_ID: ${{ vars.CLOUDFLARE_QUOTA_DATABASE_ID }}
      CLOUDFLARE_QUOTA_DATABASE_NAME: ${{ vars.CLOUDFLARE_QUOTA_DATABASE_NAME }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Download the verified application build
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.release-plan.outputs.run_id }}
        run: gh run download "$CI_RUN_ID" --name application-build
      - run: npm run verify:app-build -- --check
      - run: node scripts/deployment-project-config.mjs
      - name: Deploy and verify; restore previous production on failure
        run: node scripts/deployment-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: Deploy application

# Deploy the exact artifact from successful main CI; never rebuild at release time.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [preview, production]
        default: preview
        required: true
      confirmation:
        description: Type DEPLOY after reviewing the target environment
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: video-chat-deployment-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      DEPLOYMENT_TARGET: ${{ inputs.target }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_QUOTA_DATABASE_ID: ${{ vars.CLOUDFLARE_QUOTA_DATABASE_ID }}
      CLOUDFLARE_QUOTA_DATABASE_NAME: ${{ vars.CLOUDFLARE_QUOTA_DATABASE_NAME }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci --no-audit
      - name: Download the successful main CI build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::This main commit has no successful CI run. Wait for CI, then deploy again."
            exit 1
          fi
          gh run download "$run_id" --name application-build
          echo "Using verified application artifact from CI run $run_id" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run verify:app-build -- --check
      - run: node scripts/deployment-project-config.mjs
      - name: Deploy and verify; restore previous production on failure
        run: node scripts/deployment-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: Feature request
description: Propose an improvement to the video-chat application.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the application makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: >
        Describe the experience you want and the smallest change that would help.
        Include an example conversation or customization when relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds or changes to the app, provider functions, or interface.

name: Bug report
description: Something in the VanillaSky application does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, customer data, or private media URLs.
        For a suspected vulnerability, use
        [private vulnerability reporting](https://github.com/VanillaSkyAi/video/security/advisories/new)
        instead of a public issue.

  - type: input
    id: version
    attributes:
      label: Application commit
      description: The exact commit from `git rev-parse HEAD`, or the deployed build identity.
      placeholder: Full Git commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node, npm, browser, and local or deployed environment.
      placeholder: Node 22, npm 11, Chrome, localhost
    validations:
      required: true

  - type: dropdown
    id: providers
    attributes:
      label: Providers in use
      multiple: true
      options:
        - Browser speech
        - Anthropic (text)
        - Custom planning provider
        - xAI (speech)
        - fal (video and transcription)
        - Pexels (stock)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest steps that reproduce it in a clean application checkout.
        Include a non-sensitive prompt and any local customizations.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Server or browser console output. Redact keys and personal data.
      render: text

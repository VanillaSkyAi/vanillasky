name: Set up the application toolchain
description: Install the pinned Node and npm toolchain and locked dependencies
inputs:
  node-version:
    description: Node version to test
    default: '22.23.1'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm install --global npm@11.17.0
      shell: bash
    - run: npm ci --no-audit
      shell: bash
